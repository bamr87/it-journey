# =============================================================================
# .theme-overrides.yml — theme files this site intentionally forks
# =============================================================================
#
# Consumed by `scripts/bin/audit-consumer` in the theme repo
# (bamr87/zer0-mistakes). It classifies every file kept here that also exists
# in the theme:
#
#   IDENTICAL            byte-for-byte the same as the theme's copy
#                        → delete it; the theme's version will be used
#   DIFFERS_JUSTIFIED    differs AND is listed below → intentional, no action
#   DIFFERS_UNJUSTIFIED  differs and is NOT listed below → flagged for review;
#                        `--strict` exits non-zero
#   UNIQUE               exists only here → this site's own file, ignored
#
# Run it from a theme checkout:
#   ./scripts/bin/audit-consumer --consumer-path /path/to/it-journey
#   ./scripts/bin/audit-consumer --consumer-path /path/to/it-journey --strict
#   ./scripts/bin/audit-consumer --consumer-path /path/to/it-journey --fix
#
# This file is a STARTING POINT, not a complete inventory: it-journey shadows
# roughly 55 theme files and only the entries below have been audited and
# justified so far. Everything else still reads as unjustified drift, which is
# correct — each one needs the same read-and-decide pass before it earns a row.
#
# Keep the `reason` current. An override whose reason has been fixed upstream
# is the signal to delete the fork and take the theme's version back.
# =============================================================================

overrides:
  - path: "_includes/content/giscus.html"
    reason: >-
      Reads the giscus theme from config (`site.giscus.data-theme`, default
      preferred_color_scheme) instead of the theme's hard-coded
      preferred_color_scheme. This site is always dark, so following the
      visitor's OS gave light-mode visitors a white widget with near-invisible
      text on the dark page; _config.yml sets dark. The rest of the
      <script> block matches the theme's. (The fork originally existed for a
      live Liquid include example in the theme's header comment that recursed
      and broke the build; that was fixed upstream in v1.28.0.)
    upstream: >-
      Tracked upstream in bamr87/zer0-mistakes#574 (proposes the same
      `site.giscus.data-theme` key). Retire this fork once that lands.

  - path: "_includes/custom/footer.html"
    reason: >-
      Shadows the theme's empty consumer-hook stub (root.html includes it right
      after core/footer-fabs.html). It renders the mobile TOC FAB for this
      site's own layouts that extend `default` (quest, quest-hub,
      quest-collection, home-os, notes-workbench, javascript). The theme's
      navigation/sidebar-config.html gates that FAB on a hard-coded list of
      THEME layouts (`sidebar_offcanvas_rendered`), so below lg these pages
      rendered #tocContents with no button to open it.
    upstream: >-
      Tracked upstream in bamr87/zer0-mistakes#570. The hook renders nothing
      whenever the theme already emitted the FAB, so the theme fix retires it
      with no duplicate #tocFab; delete this file and row once that lands.
