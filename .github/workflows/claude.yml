name: Claude

# kit: agent-context v0.5.0
# @claude mention handler, seeded from bamr87/bamr87 templates/agent-context/.
# Mention @claude in an issue or PR comment and Claude Code picks up the task.
#
# Auth: OAuth only for now — CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
# ANTHROPIC_API_KEY is disabled (2026-11-15): the order is pinned to `oauth` and
# the key is no longer passed. To restore, point `order:` back at the
# CLAUDE_AUTH_ORDER variable and re-add the secrets.ANTHROPIC_API_KEY references below.
# See bamr87/bamr87 docs/AI-INTEGRATION.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

# One Claude run at a time per issue/PR thread. Without this, several @claude
# mentions in quick succession each spin up their own 30-minute agent against
# the same thread, racing each other on the same branch.
#
# Deliberately NOT cancel-in-progress: each mention is a distinct request and
# the agent commits and pushes, so a superseded run is queued behind the current
# one rather than killed mid-push.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The order is pinned to `oauth` for now (normally this repo's CLAUDE_AUTH_ORDER,
      # ai_auth: in bamr87/bamr87 _data/fleet.yml) — a method NAME, never a secret, in the output.
      - name: Choose the Claude credential (ai_auth order)
        id: claude-auth
        uses: bamr87/bamr87/.github/actions/claude-auth@main
        with:
          order: oauth
          has-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          # Claude auth: OAuth only (CLAUDE_CODE_OAUTH_TOKEN). ANTHROPIC_API_KEY disabled for now (2026-11-15); to restore, re-add the secrets.ANTHROPIC_API_KEY reference.

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.claude-auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Claude auth: OAuth only (CLAUDE_CODE_OAUTH_TOKEN). ANTHROPIC_API_KEY disabled for now (2026-11-15); to restore, re-add the secrets.ANTHROPIC_API_KEY reference.
