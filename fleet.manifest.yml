# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/it-journey
provenance: derived
summary: A quest-driven learning site run by an AI fleet — the quest-perfection loop (walk, fix, video), the content factory + CMS daily loop, the issue autopilot, quest forge / idea intake, and a theme-scout canary; the agentic lanes sit behind *_ENABLED repo variables and none merges its own work outside the label-routed auto-merge lane.
lanes:
- id: agent-audit
  kind: analysis
  harness: claude-cli
  implementation: .github/workflows/agent-audit.yml
  description: 🔍 Agent Audit
  triggers:
  - kind: schedule
    cron: 0 6 * * 1
  - kind: dispatch
  switch: AGENT_AUDIT_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: agent-plan-then-act
  kind: other
  harness: claude-cli
  implementation: .github/workflows/agent-plan-then-act.yml
  description: 🜂 Agent Plan-then-Act (GH-600 reference)
  triggers:
  - kind: dispatch
  switch: AGENT_DEMO_ENABLED
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: agentic-quest-review
  kind: review
  harness: claude-cli
  implementation: .github/workflows/agentic-quest-review.yml
  description: 🤖 Agentic Quest Review
  triggers:
  - kind: event
    events:
    - pull_request
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: cms-daily-loop
  kind: content
  harness: claude-cli
  implementation: .github/workflows/cms-daily-loop.yml
  description: 🧭 CMS Daily Content Loop
  triggers:
  - kind: schedule
    cron: 0 9 * * *
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - GITHUB_TOKEN
  guardrails:
    never_merges: false
- id: content-factory
  kind: content
  harness: claude-cli
  implementation: .github/workflows/content-factory.yml
  description: 🏭 Content Factory
  triggers:
  - kind: schedule
    cron: 0 8 * * *
  - kind: dispatch
  switch: CONTENT_FACTORY_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: content-review
  kind: review
  harness: claude-cli
  implementation: .github/workflows/content-review.yml
  description: 📝 Content Review
  triggers:
  - kind: event
    events:
    - pull_request
  switch: CONTENT_REVIEW_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: issue-autopilot
  kind: other
  harness: claude-cli
  implementation: .github/workflows/issue-autopilot.yml
  description: 🧭 Issue Autopilot
  triggers:
  - kind: schedule
    cron: 0 7 * * *
  - kind: event
    events:
    - issues
  - kind: dispatch
  switch: ISSUE_AUTOCLOSE_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: quest-fix
  kind: other
  harness: claude-cli
  implementation: .github/workflows/quest-fix.yml
  description: 🔧 Quest Fix
  triggers:
  - kind: event
    events:
    - workflow_call
  - kind: dispatch
  switch: QUEST_FIX_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - GITHUB_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
- id: quest-forge
  kind: other
  harness: claude-cli
  implementation: .github/workflows/quest-forge.yml
  description: ⚔️ Quest Forge
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
  - kind: dispatch
  switch: QUEST_FORGE_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: quest-idea-intake
  kind: other
  harness: claude-cli
  implementation: .github/workflows/quest-idea-intake.yml
  description: Quest Idea Intake
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
  - kind: dispatch
  switch: QUEST_IDEA_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: quest-perfection
  kind: other
  harness: claude-cli
  implementation: .github/workflows/quest-perfection.yml
  description: ♾️ Quest Perfection Loop
  triggers:
  - kind: schedule
    cron: 0 11 * * *
  - kind: dispatch
  switch: QUEST_PERFECTION_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
- id: quest-video
  kind: other
  harness: claude-cli
  implementation: .github/workflows/quest-video.yml
  description: 🎬 Quest Walkthrough Video
  triggers:
  - kind: dispatch
  switch: QUEST_VIDEO_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - GITHUB_TOKEN
  - PAT_TOKEN
  - YOUTUBE_CLIENT_ID
  - YOUTUBE_CLIENT_SECRET
  - YOUTUBE_PLAYLIST_ID
  - YOUTUBE_REFRESH_TOKEN
  guardrails:
    never_merges: true
- id: quest-walkthrough
  kind: other
  harness: claude-cli
  implementation: .github/workflows/quest-walkthrough.yml
  description: 🧭 Quest Walkthrough
  triggers:
  - kind: dispatch
  switch: QUEST_WALKTHROUGH_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - AUTO_PR_GITHUB_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - PAT_TOKEN
  guardrails:
    never_merges: true
- id: theme-scout
  kind: content
  harness: claude-cli
  implementation: .github/workflows/theme-scout.yml
  description: 🔭 Theme Scout
  triggers:
  - kind: schedule
    cron: 0 6 * * 2
  - kind: dispatch
  switch: THEME_SCOUT_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - THEME_REPO_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - agent-audit
  - agentic-quest-review
  - claude
  - cms-daily-loop
  - content-factory
  - content-review
  - issue-autopilot
  - quest-fix
  - quest-forge
  - quest-idea-intake
  - quest-perfection
  - quest-video
  - quest-walkthrough
  - theme-scout
- name: AUTO_PR_GITHUB_TOKEN
  scope: repo
  required: true
  used_by:
  - agent-audit
  - content-factory
  - issue-autopilot
  - quest-fix
  - quest-forge
  - quest-perfection
  - quest-video
  - quest-walkthrough
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by 
`claude setup-token`.'
  used_by:
  - agent-audit
  - agentic-quest-review
  - claude
  - cms-daily-loop
  - content-factory
  - content-review
  - issue-autopilot
  - quest-fix
  - quest-forge
  - quest-idea-intake
  - quest-perfection
  - quest-video
  - quest-walkthrough
  - theme-scout
- name: GITHUB_TOKEN
  scope: repo
  required: true
  purpose: Ambient Actions token; cannot write to other repositories.
  used_by:
  - cms-daily-loop
  - quest-fix
  - quest-video
- name: PAT_TOKEN
  scope: repo
  required: true
  used_by:
  - agent-audit
  - content-factory
  - issue-autopilot
  - quest-fix
  - quest-forge
  - quest-perfection
  - quest-video
  - quest-walkthrough
- name: THEME_REPO_TOKEN
  scope: repo
  required: true
  used_by:
  - theme-scout
- name: YOUTUBE_CLIENT_ID
  scope: repo
  required: true
  used_by:
  - quest-video
- name: YOUTUBE_CLIENT_SECRET
  scope: repo
  required: true
  used_by:
  - quest-video
- name: YOUTUBE_PLAYLIST_ID
  scope: repo
  required: true
  used_by:
  - quest-video
- name: YOUTUBE_REFRESH_TOKEN
  scope: repo
  required: true
  used_by:
  - quest-video
agents:
- agent-auditor
- content-curator
- content-reviewer
- idea-refiner
- issue-resolver
- issue-triager
- quest-fixer
- quest-forge
- quest-walker
- theme-scout
skills:
- brand-voice
- cms-curator
- content-curator
- integration-ruby
- issue-triage
- quest-character-data-scientist
- quest-character-developer
- quest-character-digital-artist
- quest-character-game-developer
- quest-character-security-specialist
- quest-character-system-engineer
- quest-fix
- quest-forge
- quest-walkthrough
- run-it-journey
- theme-scout

